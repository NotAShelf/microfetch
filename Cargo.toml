[package]
name                   = "microfetch"
description            = "Microscopic fetch tool in Rust, for NixOS systems, with special emphasis on speed"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
readme                 = "docs/README.md"
repository.workspace   = true
include                = [ "/LICENSE", "/build.rs", "/docs/README.md", "/src" ]

[[bin]]
name = "microfetch"
test = false

[dependencies]
microfetch-asm.workspace = true
microfetch-lib.workspace = true

[lints]
workspace = true

[workspace]
members  = [ "crates/asm", "crates/benchmarks", "crates/lib" ]
resolver = "3"

[workspace.package]
edition      = "2024"
license      = "GPL-3.0"
repository   = "https://github.com/notashelf/microfetch"
rust-version = "1.95.0"
version      = "1.2.3"

[workspace.dependencies]
microfetch-asm = { path = "./crates/asm", version = "1.2.3" }
microfetch-lib = { path = "./crates/lib", version = "1.2.3" }

criterion = { default-features = false, features = [ "cargo_bench_support" ], version = "0.8.2" }

[workspace.lints.clippy]
complexity  = { level = "warn", priority = -1 }
nursery     = { level = "warn", priority = -1 }
pedantic    = { level = "warn", priority = -1 }
perf        = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }
style       = { level = "warn", priority = -1 }

blanket_clippy_restriction_lints = "allow"

arbitrary_source_item_ordering  = "allow"
arithmetic_side_effects         = "allow"
cfg_not_test                    = "allow"
exhaustive_enums                = "allow"
exhaustive_structs              = "allow"
implicit_return                 = "allow"
indexing_slicing                = "allow"
inline_asm_x86_intel_syntax     = "allow"
inline_modules                  = "allow"
integer_division                = "allow"
integer_division_remainder_used = "allow"
missing_docs_in_private_items   = "allow"
missing_inline_in_public_items  = "allow"
multiple_unsafe_ops_per_block   = "allow"
pattern_type_mismatch           = "allow"
pub_with_shorthand              = "allow"
question_mark_used              = "allow"
semicolon_inside_block          = "allow"
separated_literal_suffix        = "allow"
similar_names                   = "allow"
single_call_fn                  = "allow"
undocumented_unsafe_blocks      = "allow"

[profile.dev]
# nix's compiler_builtins carries compiler-rt objects that need libc, and only
# LTO keeps a debug link from pulling them in sadly
lto       = "fat"
opt-level = 1
panic     = "abort"

[profile.release]
codegen-units = 1
lto           = "fat"
opt-level     = "s"
panic         = "abort"
strip         = true

[profile.profiler]
debug           = true
inherits        = "release"
split-debuginfo = "unpacked"
strip           = "none"
