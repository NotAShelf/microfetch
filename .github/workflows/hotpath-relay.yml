name: hotpath-relay

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] hotpath relays the PR report artifact
    workflows: ["hotpath-benchmark"]
    types:
      - completed

jobs:
  relay:
    uses: pawurb/hotpath-rs/.github/workflows/hotpath-relay.yml@a9b63a7472d299ed43f0f25dd30b6c969f636814 # v0.29.1
    permissions:
      actions: read
      id-token: write
      pull-requests: read
    with:
      benchmark: microfetch
      artifact_name: hotpath-report
      report_file: report.json
