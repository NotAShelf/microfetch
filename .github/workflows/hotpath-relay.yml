name: hotpath-relay

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] hotpath relays the PR report artifact
    workflows: ["hotpath-benchmark"]
    types:
      - completed

jobs:
  relay:
    uses: pawurb/hotpath-rs/.github/workflows/hotpath-relay.yml@3c6a2b5dd994da3db5a3d23e1cc6b91c542bec2a # v0.28.5
    permissions:
      actions: read
      id-token: write
      pull-requests: read
    with:
      benchmark: microfetch
      artifact_name: hotpath-report
      report_file: report.json
