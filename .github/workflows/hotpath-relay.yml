name: hotpath-relay

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] hotpath relays the PR report artifact
    workflows: ["hotpath-benchmark"]
    types:
      - completed

jobs:
  relay:
    uses: pawurb/hotpath-rs/.github/workflows/hotpath-relay.yml@3ed8abc83adcb36d8eabe33a8c919752e6966b37 # v0.31.1
    permissions:
      actions: read
      id-token: write
      pull-requests: read
    with:
      benchmark: microfetch
      artifact_name: hotpath-report
      report_file: report.json
