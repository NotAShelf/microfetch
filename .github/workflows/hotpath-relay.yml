name: hotpath-relay

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] hotpath relays the PR report artifact
    workflows: ["hotpath-benchmark"]
    types:
      - completed

jobs:
  relay:
    uses: pawurb/hotpath-rs/.github/workflows/hotpath-relay.yml@d1689a707565a67f4ff0b81cdb1b26c7351abede # v0.30.3
    permissions:
      actions: read
      id-token: write
      pull-requests: read
    with:
      benchmark: microfetch
      artifact_name: hotpath-report
      report_file: report.json
