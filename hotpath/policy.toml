# hotpath Cloud performance regression and budgets config.
#
# Docs: https://hotpath.rs/cloud

[functions]
min_percent_total = 2

[functions.alloc]
judged             = true
metrics            = [ "avg", "total" ]
min_calls          = 1
min_percent_change = 20

[functions.timing]
judged             = false
metrics            = [ "avg", "total" ]
min_calls          = 1
min_percent_change = 50
